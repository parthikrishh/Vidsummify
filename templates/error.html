<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error - VidSummify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .error-container {
      background: #ffffff;
      padding: 50px;
      border-radius: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      max-width: 600px;
      margin: 50px auto;
      text-align: center;
    }
    .error-icon {
      font-size: 5rem;
      color: #ff6b6b;
      margin-bottom: 20px;
    }
    .error-title {
      color: #1a202c;
      font-size: 2rem;
      font-weight: 800;
      font-family: 'Poppins', sans-serif;
      margin-bottom: 20px;
    }
    .error-message {
      color: #4a5568;
      font-size: 1.1em;
      font-family: 'Inter', sans-serif;
      margin-bottom: 30px;
      line-height: 1.6;
    }
  </style>
</head>
<body class="bg-gradient">
  <div class="error-container">
    <div class="error-icon">
      <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h1 class="error-title">Oops! Something went wrong</h1>
    <p class="error-message">{{ error_message }}</p>
    <a href="/" class="btn btn-primary btn-lg">
      <i class="fas fa-arrow-left"></i> Go Back Home
    </a>
  </div>
</body>
</html>
