<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results - {{ video_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    /* Center and style the video */
    .video-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 40px;
    }

    .video-rectangle {
      width: 85%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
      border: 3px solid rgba(102, 126, 234, 0.2);
    }

    /* Larger and centered audio bar */
    .audio-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }

    audio {
      width: 85%;
      max-width: 600px;
      height: 60px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .result-title {
      color: #1a202c;
      font-size: 2.8rem;
      font-weight: 900;
      font-family: 'Poppins', sans-serif;
      margin-bottom: 2rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

    .result-title i {
      color: #667eea;
      margin-right: 15px;
    }

    .content-card {
      min-height: 350px;
      padding: 30px;
      margin-bottom: 25px;
      background: #ffffff;
    }

    .content-card h3 {
      color: #1a202c;
      font-weight: 800;
      margin-bottom: 20px;
      font-size: 1.6rem;
      font-family: 'Poppins', sans-serif;
    }

    .content-card h3 i {
      color: #667eea;
      margin-right: 10px;
    }

    .content-card p {
      color: #2d3748;
      line-height: 1.8;
      font-size: 1.05em;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
    }

    .transcript-card {
      border-left: 5px solid #667eea;
    }

    .summary-card {
      border-left: 5px solid #4facfe;
    }

    .summary-card h3 i {
      color: #4facfe;
    }

    .audio-card {
      background: linear-gradient(135deg, rgba(46, 213, 115, 0.1) 0%, rgba(0, 242, 254, 0.1) 100%);
      padding: 35px;
      border-left: 5px solid #2ed573;
    }

    .audio-card h4 {
      color: #1a202c;
      font-weight: 800;
      margin-bottom: 20px;
      font-size: 1.6rem;
      font-family: 'Poppins', sans-serif;
    }

    .audio-card h4 i {
      color: #2ed573;
      margin-right: 10px;
    }

    .back-button {
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      .video-rectangle {
        width: 95%;
      }

      audio {
        width: 95%;
        height: 50px;
      }

      .result-title {
        font-size: 2rem;
      }

      .content-card {
        min-height: auto;
        padding: 20px;
      }
    }
  </style>
</head>
<body class="bg-gradient">

<div class="container py-5">
  <h1 class="result-title text-center">
    <i class="fas fa-file-alt"></i> Results for: {{ video_name }}
  </h1>

  <!-- Video (rectangular and centered) -->
  <div class="video-wrapper">
    <video controls class="video-rectangle">
      <source src="{{ url_for('static', filename=video_file) }}" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <div class="row">
    <div class="col-md-6 mb-4">
      <div class="card content-card transcript-card">
        <h3><i class="fas fa-file-alt"></i> Transcribed Text</h3>
        <p style="white-space: pre-wrap; max-height: 400px; overflow-y: auto; color: #2d3748;">{{ transcript }}</p>
      </div>
    </div>

    <div class="col-md-6 mb-4">
      <div class="card content-card summary-card">
        <h3><i class="fas fa-magic"></i> Summary</h3>
        <p style="white-space: pre-wrap; max-height: 400px; overflow-y: auto; color: #2d3748;">{{ summary }}</p>
      </div>
    </div>
  </div>

  <!-- Summary Audio (larger) -->
  <div class="card audio-card text-center">
    <h4><i class="fas fa-headphones"></i> Summary Audio</h4>
    <div class="audio-wrapper">
      <audio controls>
        <source src="{{ url_for('static', filename=summary_audio) }}" type="audio/mpeg">
        Your browser does not support the audio tag.
      </audio>
    </div>
  </div>

  <div class="text-center back-button">
    <a href="/" class="btn btn-light btn-lg">
      <i class="fas fa-arrow-left"></i> Upload Another Video
    </a>
  </div>
</div>

</body>
</html>
