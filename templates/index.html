<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidSummify - Video Summarizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    #loading {
      display: none;
      color: #2d3748;
      font-weight: bold;
      font-size: 1.3em;
    }
    #cancel-alert {
      display: none;
      width: 50%;
      margin: 20px auto;
    }
    .logo-container {
      margin-bottom: 2rem;
    }
    .logo-icon {
      font-size: 4rem;
      color: #667eea;
      margin-bottom: 1rem;
      display: inline-block;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .main-title {
      color: #1a202c;
      font-size: 3.5rem;
      font-weight: 900;
      font-family: 'Poppins', sans-serif;
      margin-bottom: 0.5rem;
      letter-spacing: -1px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }
    .subtitle {
      color: #4a5568;
      font-size: 1.2rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      margin-top: 0.5rem;
      line-height: 1.6;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }
    .upload-form {
      background: #ffffff;
      padding: 45px;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      max-width: 650px;
      margin: 0 auto;
      border: 1px solid rgba(102, 126, 234, 0.1);
    }
    .file-input-wrapper {
      position: relative;
      margin-bottom: 30px;
    }
    .file-input-label {
      color: #2d3748;
      font-weight: 700;
      font-size: 1.15em;
      margin-bottom: 15px;
      display: block;
      font-family: 'Inter', sans-serif;
    }
    .file-input-label i {
      color: #667eea;
      margin-right: 8px;
    }
    .file-input-wrapper input[type="file"] {
      padding: 18px;
      border: 3px dashed #667eea;
      border-radius: 15px;
      background: rgba(102, 126, 234, 0.05);
      transition: all 0.3s ease;
      color: #2d3748;
      font-weight: 500;
    }
    .file-input-wrapper input[type="file"]:hover {
      border-color: #764ba2;
      background: rgba(102, 126, 234, 0.1);
      transform: translateY(-2px);
    }
    .file-input-wrapper input[type="file"]::file-selector-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      margin-right: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .file-input-wrapper input[type="file"]::file-selector-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .file-info {
      color: #718096;
      font-size: 0.9em;
      margin-top: 12px;
      font-weight: 500;
    }
    .file-info i {
      color: #667eea;
      margin-right: 6px;
    }
    .loading-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      max-width: 650px;
      margin: 30px auto;
      border: 1px solid rgba(102, 126, 234, 0.1);
    }
    #progress-text {
      color: #2d3748;
      font-size: 1.15em;
      margin-top: 15px;
      font-weight: 600;
    }
    .loading-title {
      color: #2d3748;
      font-size: 1.3em;
      margin-bottom: 15px;
      font-weight: 700;
    }
    @media (max-width: 768px) {
      .main-title {
        font-size: 2.5rem;
      }
      .subtitle {
        font-size: 1rem;
        padding: 0 15px;
      }
      .upload-form {
        padding: 30px 25px;
        margin: 0 15px;
      }
      .logo-icon {
        font-size: 3rem;
      }
    }
  </style>
</head>
<body class="bg-gradient text-center py-5">

  <div class="logo-container">
    <div class="logo-icon">
      <i class="fas fa-video"></i>
    </div>
    <h1 class="main-title">VidSummify</h1>
    <p class="subtitle">
      Transform your videos into concise summaries with AI-powered transcription
    </p>
  </div>

  <!-- Cancel alert -->
  <div id="cancel-alert" class="alert alert-danger fw-bold" role="alert">
    <i class="fas fa-times-circle"></i> Processing canceled by user. Redirecting...
  </div>

  <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data" class="upload-form">
    <div class="file-input-wrapper">
      <label for="videoFile" class="file-input-label">
        <i class="fas fa-cloud-upload-alt"></i> Select Video File
      </label>
      <input type="file" name="video" id="videoFile" accept=".mp4" class="form-control form-control-lg" required>
      <div class="file-info">
        <i class="fas fa-info-circle"></i> Only MP4 files are supported
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-100">
      <i class="fas fa-rocket"></i> Upload & Process
    </button>
  </form>

  <div id="loading" class="loading-container mt-4">
    <div class="text-center">
      <i class="fas fa-cog fa-spin" style="font-size: 3.5rem; color: #667eea; margin-bottom: 25px;"></i>
      <div class="loading-title">
        Processing your video...
      </div>
      <div id="progress-text" class="mt-3"></div>

      <!-- Progress Bar -->
      <div class="progress mt-4" style="width: 100%; margin: 0 auto;">
        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated"
             role="progressbar" style="width: 0%">0%</div>
      </div>

      <!-- Cancel Button -->
      <button id="cancelBtn" class="btn btn-danger mt-4">
        <i class="fas fa-stop-circle"></i> Cancel Processing
      </button>
    </div>
  </div>

  <script>
    document.getElementById("uploadForm").addEventListener("submit", function() {
      document.getElementById("loading").style.display = "block";
      const progressText = document.getElementById("progress-text");
      const progressBar = document.getElementById("progress-bar");
      const cancelBtn = document.getElementById("cancelBtn");
      const cancelAlert = document.getElementById("cancel-alert");
      let canceled = false;

      const interval = setInterval(async () => {
        if (canceled) return;

        try {
          const response = await fetch("/progress");
          const data = await response.json();

          // Update text
          progressText.textContent = `${data.stage} (${data.percent}%)`;

          // Update bar
          progressBar.style.width = `${data.percent}%`;
          progressBar.textContent = `${data.percent}%`;

          // Color transitions
          if (data.percent < 40) {
            progressBar.className = "progress-bar bg-info progress-bar-striped progress-bar-animated";
          } else if (data.percent < 80) {
            progressBar.className = "progress-bar bg-warning progress-bar-striped progress-bar-animated";
          } else {
            progressBar.className = "progress-bar bg-success progress-bar-striped progress-bar-animated";
          }

          // Stop polling on completion
          if (data.percent >= 100) {
            clearInterval(interval);
            progressText.textContent = "✅ Completed successfully!";
            progressBar.textContent = "100%";
            progressBar.className = "progress-bar bg-success";
          }
        } catch (error) {
          console.error("Error fetching progress:", error);
        }
      }, 1000);

      // Cancel processing (frontend + backend)
      cancelBtn.addEventListener("click", async () => {
        canceled = true;
        clearInterval(interval);

        try {
          await fetch("/cancel", { method: "POST" });
        } catch (error) {
          console.error("Error canceling:", error);
        }

        progressText.textContent = "❌ Processing canceled by user.";
        progressBar.className = "progress-bar bg-danger";
        progressBar.style.width = "100%";
        progressBar.textContent = "Canceled";

        // Show cancel alert and redirect after 3 seconds
        cancelAlert.style.display = "block";
        setTimeout(() => {
          window.location.href = "/";
        }, 3000);
      });
    });
  </script>

</body>
</html>
